<svg xmlns="http://www.w3.org/2000/svg" width="740" height="350" viewBox="0 0 740 350" role="img" aria-label="Growth exponent by width, by implementation"><title>Growth exponent by width, by implementation</title><style>text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }</style><rect x="0.5" y="0.5" width="739" height="349" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/><text x="16" y="24" class="f-fg" fill="#1a1d23" font-size="14" font-weight="700">Growth exponent by width: 1 is linear, 2 is quadratic</text><text x="16" y="42" class="f-muted" fill="#4a515b" font-size="11">Slope of log(time) against log(size). Hollow bars are fits too poor to read as a measurement.</text><line x1="392" y1="58" x2="392" y2="306" class="s-grid" stroke="#d0d4da" stroke-width="1" stroke-dasharray="3 3"/><text x="392" y="322" class="f-muted" fill="#4a515b" font-size="10" text-anchor="middle">linear</text><line x1="560" y1="58" x2="560" y2="306" class="s-grid" stroke="#d0d4da" stroke-width="1" stroke-dasharray="3 3"/><text x="560" y="322" class="f-muted" fill="#4a515b" font-size="10" text-anchor="middle">quadratic</text><text x="216" y="85" class="f-fg" fill="#1a1d23" font-size="11" text-anchor="end">canonicalize</text><rect x="224" y="72" width="193.7343240919306" height="16" rx="2" class="f-bar" fill="#2f5d90"/><text x="425.7343240919306" y="85" class="f-muted" fill="#4a515b" font-size="11">1.15</text><text x="216" y="115" class="f-fg" fill="#1a1d23" font-size="11" text-anchor="end">json-canonicalize</text><rect x="224" y="102" width="190.63655727404262" height="16" rx="2" class="f-bar" fill="#2f5d90"/><text x="422.6365572740426" y="115" class="f-muted" fill="#4a515b" font-size="11">1.13</text><text x="216" y="145" class="f-fg" fill="#1a1d23" font-size="11" text-anchor="end">safe-stable-stringify</text><rect x="224" y="132" width="177.23774725997197" height="16" rx="2" class="f-bar" fill="#2f5d90"/><text x="409.23774725997197" y="145" class="f-muted